<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IonCo Pro | Client & Fleet Portal Login</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/6823/6823621.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        voltAmber: { 50: '#fffbeb', 500: '#f59e0b', 600: '#d97706', 900: '#78350f' },
                        voltDark: { 900: '#090d16', 950: '#04060b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative">

    <main class="volt-container py-12 flex items-center justify-center">

        <div class="max-w-md w-full glossy-card p-8 sm:p-10 rounded-3xl border border-voltAmber-500/30 shadow-2xl space-y-8 reveal-on-scroll">
            
            <!-- RTL & Theme Toggle Buttons with Directional Arrows -->
            <div class="flex items-center justify-end gap-2">
                <button type="button" id="rtlToggle" class="px-3 h-10 rounded-full bg-white dark:bg-neutral-900 border border-slate-200 dark:border-neutral-800 text-xs font-black uppercase shadow-md flex items-center gap-1.5 justify-center cursor-pointer">
                    <span id="rtlArrow">←</span> <span id="rtlText">RTL</span>
                </button>
                <button type="button" id="themeToggle" class="w-10 h-10 rounded-full bg-white dark:bg-neutral-900 border border-slate-200 dark:border-neutral-800 flex items-center justify-center shadow-md cursor-pointer" aria-label="Toggle Theme">
                    <span class="material-symbols-outlined text-sm">dark_mode</span>
                </button>
            </div>

            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-voltAmber-500/10 border border-voltAmber-500/30 flex items-center justify-center text-voltAmber-500 mx-auto overflow-hidden">
                   <a href="index.html"><img src="https://cdn-icons-png.flaticon.com/512/6823/6823621.png" alt="brand-logo" class="w-6 h-6 object-contain"/></a> 
                </div>
                <h1 class="text-2xl sm:text-3xl font-black">IonCo</h1>
                <p class="text-xs text-slate-500 dark:text-neutral-400 font-medium">Sign in to your IonCo customer or fleet supervisor workspace.</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest mb-1 text-slate-500">Email Address / Registered Phone</label>
                    <input type="text" id="loginIdentifier" placeholder="user@domain.com or mobile" required class="w-full px-4 py-3 rounded-2xl bg-slate-100 dark:bg-neutral-900 border border-slate-200 dark:border-neutral-800 text-xs font-bold outline-none focus:border-voltAmber-500" required>
                    <span class="error-msg">Please enter a valid email or phone number.</span>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-500">Access Password</label>
                        <a href="contact.html" class="text-[10px] font-bold text-voltAmber-500 hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full px-4 py-3 rounded-2xl bg-slate-100 dark:bg-neutral-900 border border-slate-200 dark:border-neutral-800 text-xs font-bold outline-none focus:border-voltAmber-500" required>
                    <span class="error-msg">Please enter your password.</span>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 accent-voltAmber-500 rounded cursor-pointer">
                    <label for="rememberMe" class="text-xs font-semibold text-slate-600 dark:text-neutral-400 cursor-pointer">Remember this device for 30 days</label>
                </div>

                <button type="submit" class="w-full py-4 bg-voltAmber-500 hover:bg-voltAmber-600 text-slate-950 rounded-full font-black text-xs uppercase tracking-widest shadow-md transition-all cursor-pointer">
                    Secure Sign In
                </button>
            </form>

            <div class="text-center pt-4 border-t border-slate-200 dark:border-neutral-800 text-xs text-slate-500 font-semibold">
                Don't have an active workspace? <a href="signup.html" class="text-voltAmber-500 font-bold hover:underline">Request account setup</a>
            </div>
        </div>

    </main>

    <!-- Master Layout Script (Handles Theme, RTL State & Controllers Globally) -->
    <script src="./js/main.js"></script>

</body>
</html>
