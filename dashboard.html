<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IonCo Pro | Operations & Fleet Telemetry Dashboard</title>
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        voltAmber: { 50: '#fffbeb', 500: '#f59e0b', 600: '#d97706', 900: '#78350f' },
                        voltDark: { 900: '#090d16', 950: '#04060b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased min-h-screen bg-slate-50 dark:bg-voltDark-950 text-slate-900 dark:text-slate-100 flex h-screen overflow-hidden">

    <!-- SIDEBAR NAVIGATION -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-voltDark-900 border-r border-slate-200 dark:border-neutral-800 flex flex-col justify-between transition-all duration-300 z-50 fixed lg:static inset-y-0 left-0 -translate-x-full lg:translate-x-0 shrink-0">
        <div class="p-6 space-y-8 overflow-y-auto">
            <!-- Brand Logo -->
            <a href="index.html" class="flex items-center gap-3 group shrink-0">
                <div class="w-11 h-11 rounded-2xl bg-gray-500/10 border border-gray-500/30 flex items-center justify-center text-voltAmber-500 overflow-hidden shadow-sm">
                    <img src="./logo.png" alt="logo" class="w-8 h-8 rounded-xl" onerror="this.style.display='none'">
                </div>
                <div class="flex flex-col leading-none">
                    <span class="text-xl font-black tracking-tight">IonCo</span>
                    <span class="text-[9px] font-black text-voltAmber-500 tracking-widest uppercase mt-0.5">Operations Core</span>
                </div>
            </a>

            <!-- Dynamic Navigation Links -->
            <nav class="space-y-1.5 text-sm font-bold uppercase tracking-wider" id="sidebarNav">
                <!-- Injected dynamically -->
            </nav>
        </div>

        <!-- Sidebar Footer Profile -->
        <div class="p-6 border-t border-slate-200 dark:border-neutral-800 space-y-4 shrink-0 bg-white dark:bg-voltDark-900">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-voltAmber-500/20 text-voltAmber-500 font-black flex items-center justify-center text-sm">RM</div>
                <div class="flex flex-col leading-tight">
                    <span class="text-sm font-black">Rishi Murugan</span>
                    <span class="text-[10px] text-slate-500 font-semibold font-mono">Supervisor ID #490</span>
                </div>
            </div>
            <a href="index.html" class="block w-full py-2.5 text-center rounded-xl bg-amber-300 dark:bg-neutral-800 hover:bg-voltAmber-500 hover:text-slate-950 text-sm font-black uppercase tracking-wider transition-all">
                Exit to Portal
            </a>
        </div>
    </aside>

    <!-- MAIN DASHBOARD CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
        
        <!-- TOP APP BAR -->
        <header class="h-20 bg-white/80 dark:bg-voltDark-900/80 backdrop-blur-md border-b border-slate-200 dark:border-neutral-800 px-6 sm:px-10 flex justify-between items-center sticky top-0 z-40 shrink-0">
            <div class="flex items-center gap-4">
                <button id="sidebarToggle" class="lg:hidden w-10 h-10 rounded-xl bg-slate-100 dark:bg-neutral-800 flex items-center justify-center cursor-pointer" aria-label="Toggle Sidebar">
                    <i class="fa-solid fa-bars text-sm"></i>
                </button>
                <div>
                    <h2 class="text-lg sm:text-xl font-black" id="topbarTitle">Operations Command</h2>
                    <p class="text-[11px] text-slate-500 dark:text-neutral-400 font-bold uppercase tracking-wider">Region: IN-South Cluster</p>
                </div>
            </div>

            <!-- Top Right Controls -->
            <div class="flex items-center gap-3">
                <button id="rtlToggle" class="px-3.5 h-10 rounded-full bg-slate-100 dark:bg-neutral-800 border border-slate-200 dark:border-neutral-700 text-sm font-black uppercase cursor-pointer transition-all hover:border-voltAmber-500">RTL</button>
                <button id="themeToggle" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-neutral-800 border border-slate-200 dark:border-neutral-700 flex items-center justify-center cursor-pointer transition-all hover:border-voltAmber-500" aria-label="Toggle Theme">
                    <span class="material-symbols-outlined text-sm">dark_mode</span>
                </button>
                
            </div>
        </header>

        <!-- DASHBOARD BODY CONTAINER (Dynamically Swapped SPA Views) -->
        <main class="p-6 sm:p-10 space-y-8 max-w-7xl mx-auto w-full flex-1 overflow-y-auto" id="dynamicViewRoot">
            <!-- Injected via Reactive JavaScript Engine -->
        </main>
    </div>

    <!-- Interactive Feedback Modal -->
    <div id="dashboardModal" class="lx-modal-overlay">
        <div class="glossy-card max-w-md w-full p-8 rounded-3xl border border-voltAmber-500/40 text-center space-y-4 shadow-2xl text-slate-900 dark:text-white">
            <div id="dashModalIcon" class="w-16 h-16 bg-voltAmber-500/20 text-voltAmber-500 rounded-full flex items-center justify-center mx-auto text-3xl font-black">✓</div>
            <h3 id="dashModalTitle" class="text-2xl font-black">Action Successful</h3>
            <p id="dashModalText" class="text-sm text-slate-600 dark:text-neutral-300 font-semibold leading-relaxed"></p>
            <button type="button" id="closeDashModalBtn" class="w-full py-3.5 bg-voltAmber-500 hover:bg-voltAmber-600 text-slate-950 rounded-full font-black text-sm uppercase tracking-widest cursor-pointer transition-all shadow-md">
                Dismiss
            </button>
        </div>
    </div>

    <!-- Master Dynamic SPA View Engine -->
    <script>
        const dashboardState = {
            activePage: 'overview',
            metrics: [
                { label: "Active Mobile Vans", value: "14 / 14", badge: "100% Ready", badgeColor: "text-emerald-500", note: "Average dispatch time: 24 mins", icon: "fa-solid fa-truck-medical" },
                { label: "Monitored Nodes", value: "1,482", badge: "99.9% Health", badgeColor: "text-emerald-500", note: "3 replacement alerts flagged", icon: "fa-solid fa-car-battery" },
                { label: "ECU Memory Saves", value: "42 Swaps", badge: "0 Data Loss", badgeColor: "text-emerald-500", note: "OBD-II secure protocols active", icon: "fa-solid fa-microchip" },
                { label: "Eco-Core Rebates", value: "₹38,500", badge: "Credited", badgeColor: "text-voltAmber-500", note: "Lead-acid recycling balanced", icon: "fa-solid fa-recycle" }
            ],
            dispatches: [
                { id: "#SOS-8492", vehicle: "Hyundai Creta (TN-07-BX-4912)", location: "Anna Nagar 4th Main Road, Chennai", van: "Van #04 (Eng. Suresh)", status: "On Site / Swapping", statusBg: "bg-amber-500/10 text-amber-500", eta: "Arrived" },
                { id: "#SOS-8493", vehicle: "Honda City (KA-01-ME-9021)", location: "Indiranagar 100ft Road, Bengaluru", van: "Van #09 (Eng. Karthik)", status: "En Route", statusBg: "bg-emerald-500/10 text-emerald-500", eta: "14 mins" },
                { id: "#SOS-8494", vehicle: "Tata Nexon EV (TN-45-Z-1102)", location: "RS Puram, Coimbatore", van: "Van #02 (Eng. Ramesh)", status: "Dispatch Assigned", statusBg: "bg-voltAmber-500/10 text-voltAmber-500", eta: "22 mins" }
            ],
            vehicles: [
                { name: "Tata Nexon (Petrol)", spec: "Amaron 48Ah DIN45 • Installed Oct 2024", status: "Healthy", statusBg: "bg-emerald-500/10 text-emerald-500 border-emerald-500/30" },
                { name: "Honda Activa 6G", spec: "Exide 4Ah Maintenance-Free", status: "Healthy", statusBg: "bg-emerald-500/10 text-emerald-500 border-emerald-500/30" }
            ],
            catalog: [
                { tag: "Best Seller", name: "Amaron Hi-Life DIN55 (55Ah)", desc: "Includes 55-month warranty & core exchange rebate.", price: "₹6,899" },
                { tag: "Heavy Duty", name: "Exide Matrix MET70 (70Ah)", desc: "Ideal for large SUVs, diesels, and heavy accessories.", price: "₹8,499" },
                { tag: "Start-Stop AGM", name: "Bosch AGM S5 (60Ah)", desc: "German engineering for luxury vehicles and regenerative braking.", price: "₹13,999" }
            ],
            analytics: [
                { label: "Average Response Time", value: "24.2 Mins", desc: "-4.5 mins vs previous quarter", valueColor: "text-voltAmber-500" },
                { label: "Core Exchange Savings", value: "₹4,82,000", desc: "Total motorist rebate credited", valueColor: "text-emerald-500" },
                { label: "ECU Preservation Rate", value: "100%", desc: "Zero data loss incidents recorded", valueColor: "text-voltAmber-500" }
            ]
        };

        const navPages = [
            { id: 'overview', label: 'Overview', icon: 'fa-solid fa-chart-pie', title: 'Operations Command' },
            { id: 'dispatches', label: 'SOS Dispatches', icon: 'fa-solid fa-truck-fast', title: 'Emergency Dispatches' },
            { id: 'telemetry', label: 'Fleet Telemetry', icon: 'fa-solid fa-microchip', title: 'Live System Telemetry' },
            { id: 'vehicles', label: 'Vehicle Profiles', icon: 'fa-solid fa-car', title: 'Registered Vehicle Profiles' },
            { id: 'catalog', label: 'Battery Catalog', icon: 'fa-solid fa-battery-full', title: 'Reserve Battery Catalog' },
            { id: 'analytics', label: 'Analytics', icon: 'fa-solid fa-chart-line', title: 'Performance Analytics' },
            { id: 'settings', label: 'API & Settings', icon: 'fa-solid fa-gear', title: 'API Webhook Settings' }
        ];

        // Render Sidebar Navigation with Active Highlight
        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;

            nav.innerHTML = navPages.map(page => {
                const isActive = dashboardState.activePage === page.id;
                return `
                    <button type="button" data-page="${page.id}" class="sidebar-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl transition-all cursor-pointer ${isActive ? 'bg-voltAmber-500 text-slate-950 font-black shadow-md' : 'hover:bg-slate-100 dark:hover:bg-neutral-800 text-slate-600 dark:text-neutral-400 font-bold'}">
                        <i class="${page.icon} w-5 text-center"></i>
                        <span>${page.label}</span>
                    </button>
                `;
            }).join('');

            // Bind click handlers to switch views dynamically without scrolling
            nav.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    dashboardState.activePage = btn.getAttribute('data-page');
                    renderSidebar();
                    renderActiveView();
                    if (window.innerWidth < 1024) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                });
            });
        }

        // Render ONLY the Active Page Content Dynamically
        function renderActiveView() {
            const root = document.getElementById('dynamicViewRoot');
            const topbarTitle = document.getElementById('topbarTitle');
            if (!root) return;

            const currentPageObj = navPages.find(p => p.id === dashboardState.activePage);
            if (topbarTitle && currentPageObj) {
                topbarTitle.textContent = currentPageObj.title;
            }

            switch(dashboardState.activePage) {
                case 'overview':
                    root.innerHTML = `
                        <div class="space-y-6">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xl font-black">Cluster Overview & Node Summary</h3>
                                <span class="text-sm text-slate-400 font-mono">Real-Time Feed</span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                ${dashboardState.metrics.map(m => `
                                    <div class="glossy-card p-6 rounded-3xl space-y-2 shadow-xl border border-slate-200 dark:border-neutral-800">
                                        <div class="flex justify-between items-center">
                                            <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">${m.label}</span>
                                            <i class="${m.icon} text-voltAmber-500 text-sm"></i>
                                        </div>
                                        <div class="flex items-baseline gap-2">
                                            <span class="text-3xl font-black font-mono">${m.value}</span>
                                            <span class="text-sm font-bold ${m.badgeColor} font-mono">${m.badge}</span>
                                        </div>
                                        <p class="text-[11px] text-slate-500 dark:text-neutral-400 font-semibold">${m.note}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'dispatches':
                    root.innerHTML = `
                        <div class="glossy-card p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-neutral-800 shadow-xl space-y-6">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div>
                                    <h3 class="text-xl font-black">Active Emergency SOS Dispatches</h3>
                                    <p class="text-sm text-slate-500 dark:text-neutral-400 font-semibold">Real-time status tracking of mobile battery units currently dispatched.</p>
                                </div>
                                <span class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-neutral-900 border border-slate-200 dark:border-neutral-800 text-sm font-bold uppercase">Filter: All Sectors</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-slate-100 dark:bg-neutral-900 uppercase font-black tracking-widest text-[10px] text-slate-500 border-b border-slate-200 dark:border-neutral-800">
                                        <tr>
                                            <th class="p-4 rounded-l-2xl">Ticket ID</th>
                                            <th class="p-4">Vehicle & Model</th>
                                            <th class="p-4">Location & Landmark</th>
                                            <th class="p-4">Assigned Van</th>
                                            <th class="p-4">Current Status</th>
                                            <th class="p-4 rounded-r-2xl text-right">ETA</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200 dark:divide-neutral-800 font-semibold">
                                        ${dashboardState.dispatches.map(d => `
                                            <tr class="hover:bg-slate-50 dark:hover:bg-neutral-900/50 transition-colors">
                                                <td class="p-4 font-mono font-bold text-voltAmber-500">${d.id}</td>
                                                <td class="p-4">${d.vehicle}</td>
                                                <td class="p-4">${d.location}</td>
                                                <td class="p-4 font-mono">${d.van}</td>
                                                <td class="p-4"><span class="px-3 py-1 rounded-full ${d.statusBg} text-[10px] font-bold uppercase tracking-wider">${d.status}</span></td>
                                                <td class="p-4 text-right font-mono font-bold">${d.eta}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    break;

                case 'telemetry':
                    root.innerHTML = `
                        <div class="glossy-card p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-neutral-800 shadow-xl space-y-6">
                            <div class="space-y-2">
                                <span class="text-voltAmber-500 text-sm font-black uppercase tracking-widest">Predictive Health Analysis</span>
                                <h3 class="text-xl font-black">Weekly Voltage Stress Telemetry</h3>
                                <p class="text-sm text-slate-500 dark:text-neutral-400 font-semibold">Average dormant cranking amperage across all registered commercial transport nodes.</p>
                            </div>
                            <div class="h-48 flex items-end gap-3 pt-6 border-t border-slate-200 dark:border-neutral-800">
                                <div class="w-full bg-voltAmber-500/30 rounded-t-xl h-[55%] flex items-center justify-center text-[11px] font-mono font-bold">Mon (12.1V)</div>
                                <div class="w-full bg-voltAmber-500/40 rounded-t-xl h-[65%] flex items-center justify-center text-[11px] font-mono font-bold">Tue (12.3V)</div>
                                <div class="w-full bg-voltAmber-500/50 rounded-t-xl h-[70%] flex items-center justify-center text-[11px] font-mono font-bold">Wed (12.4V)</div>
                                <div class="w-full bg-voltAmber-500/70 rounded-t-xl h-[85%] flex items-center justify-center text-[11px] font-mono font-bold">Thu (12.6V)</div>
                                <div class="w-full bg-voltAmber-500 rounded-t-xl h-[95%] shadow-lg flex items-center justify-center text-[11px] font-mono font-bold text-slate-950">Fri (12.8V)</div>
                            </div>
                        </div>
                    `;
                    break;

                case 'vehicles':
                    root.innerHTML = `
                        <div class="space-y-6">
                            <h3 class="text-xl font-black uppercase tracking-wider">Registered Vehicle Profiles</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${dashboardState.vehicles.map(v => `
                                    <div class="glossy-card p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-neutral-800 flex justify-between items-center shadow-xl">
                                        <div class="space-y-1.5">
                                            <span class="text-[10px] font-mono text-voltAmber-500 uppercase font-bold tracking-widest">Active Node</span>
                                            <h4 class="font-black text-lg">${v.name}</h4>
                                            <p class="text-sm text-slate-500 dark:text-neutral-400 font-semibold">${v.spec}</p>
                                        </div>
                                        <span class="px-3.5 py-1.5 ${v.statusBg} text-[10px] font-black uppercase tracking-wider rounded-full border">${v.status}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'catalog':
                    root.innerHTML = `
                        <div class="space-y-6">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xl font-black uppercase tracking-wider">Quick Reserve Battery Catalog</h3>
                                <a href="pricing.html" class="text-sm font-bold text-voltAmber-500 hover:underline">View Full Catalog →</a>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                ${dashboardState.catalog.map(c => `
                                    <div class="glossy-card p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-neutral-800 space-y-4 shadow-xl flex flex-col justify-between group">
                                        <div class="space-y-2">
                                            <span class="text-[10px] font-mono text-voltAmber-500 font-black uppercase tracking-widest">${c.tag}</span>
                                            <h4 class="font-black text-lg">${c.name}</h4>
                                            <p class="text-sm text-slate-500 dark:text-neutral-400 font-semibold leading-relaxed">${c.desc}</p>
                                        </div>
                                        <div class="flex justify-between items-center pt-4 border-t border-slate-200 dark:border-neutral-800">
                                            <span class="font-black font-mono text-lg text-slate-900 dark:text-white">${c.price}</span>
                                            <button type="button" class="px-5 py-2.5 bg-voltAmber-500 hover:bg-voltAmber-600 text-slate-950 font-black text-sm uppercase tracking-widest rounded-full cursor-pointer transition-all shadow-md" onclick="triggerQuickOrder('${c.name}')">Quick Swap</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'analytics':
                    root.innerHTML = `
                        <div class="glossy-card p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-neutral-800 shadow-xl space-y-6">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div>
                                    <h3 class="text-xl font-black">Fleet Performance & Cost Analytics</h3>
                                    <p class="text-sm text-slate-500 dark:text-neutral-400 font-semibold">Quarterly breakdown of roadside response efficiency and core recycling savings.</p>
                                </div>
                                <span class="px-3.5 py-1.5 rounded-xl bg-voltAmber-500/10 text-voltAmber-500 text-sm font-black uppercase tracking-widest border border-voltAmber-500/30">Q2 2026 Verified</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                                ${dashboardState.analytics.map(a => `
                                    <div class="p-6 rounded-2xl bg-slate-100 dark:bg-neutral-900 border border-slate-200 dark:border-neutral-800 space-y-2">
                                        <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">${a.label}</span>
                                        <h4 class="text-3xl font-black font-mono ${a.valueColor}">${a.value}</h4>
                                        <p class="text-sm text-slate-500 dark:text-neutral-400 font-semibold">${a.desc}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                case 'settings':
                    root.innerHTML = `
                        <div class="bg-slate-950 p-6 sm:p-8 rounded-3xl border border-neutral-800 shadow-2xl font-mono text-sm text-slate-300 space-y-4 flex flex-col justify-between text-white">
                            <div class="flex justify-between items-center pb-3 border-b border-neutral-800 text-slate-500">
                                <span>IonCo_fleet_sync.js</span>
                                <span class="text-voltAmber-400 font-bold">Node.js SDK v4.2</span>
                            </div>
                            <pre class="overflow-x-auto text-voltAmber-300 leading-relaxed text-[11px]">
<span class="text-slate-500">// Initialize IonCo Fleet Telemetry Client</span>
const { IonCoFleet } = require('@IonCo/sdk');
const fleet = new IonCoFleet({
  apiKey: process.env.IonCo_API_KEY,
  region: 'in-south-1'
});

async function monitorNode(vehicleId) {
  const telemetry = await fleet.getBatteryTelemetry(vehicleId);
  if (telemetry.voltage &lt; 11.8) {
    await fleet.dispatchEmergencyVan({ vehicleId, priority: 'HIGH' });
  }
}</pre>
                            <div class="pt-4 border-t border-neutral-800 flex justify-between items-center text-[11px]">
                                <span class="text-slate-400">API Access Key Configured</span>
                                <span class="text-voltAmber-500 font-bold">Active & Secure</span>
                            </div>
                        </div>
                    `;
                    break;
            }
        }

        // Modal Action Helper
        function triggerQuickOrder(batteryName) {
            const modal = document.getElementById('dashboardModal');
            document.getElementById('dashModalTitle').textContent = "Quick Reserve Confirmed";
            document.getElementById('dashModalText').innerHTML = `Your order for <strong>${batteryName}</strong> has been tied to your primary profile. Our dispatch van will bring this unit for your doorstep installation.`;
            modal.classList.add('is-active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderActiveView();

            // Mobile Sidebar Toggle
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('-translate-x-full');
                });
            }

            // Modal Close Handler
            const modal = document.getElementById('dashboardModal');
            const closeModalBtn = document.getElementById('closeDashModalBtn');
            if (closeModalBtn && modal) {
                closeModalBtn.addEventListener('click', () => {
                    modal.classList.remove('is-active');
                });
            }

            // Theme & RTL Controllers
            const htmlElement = document.documentElement;
            const themeToggleBtn = document.getElementById('themeToggle');
            const rtlToggleBtn = document.getElementById('rtlToggle');

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    htmlElement.classList.toggle('dark');
                    const isDark = htmlElement.classList.contains('dark');
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');
                    themeToggleBtn.innerHTML = `<span class="material-symbols-outlined text-sm">${isDark ? 'light_mode' : 'dark_mode'}</span>`;
                });
            }

            if (rtlToggleBtn) {
                rtlToggleBtn.textContent = htmlElement.getAttribute('dir') === 'rtl' ? 'LTR' : 'RTL';
                rtlToggleBtn.addEventListener('click', () => {
                    const currentIsRtl = htmlElement.getAttribute('dir') === 'rtl';
                    const newDir = currentIsRtl ? 'ltr' : 'rtl';
                    htmlElement.setAttribute('dir', newDir);
                    localStorage.setItem('dir', newDir);
                    rtlToggleBtn.textContent = newDir === 'rtl' ? 'LTR' : 'RTL';
                });
            }
        });
    </script>
</body>
</html>
