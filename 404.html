<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IonCo Pro | 404 - Battery Disconnected</title>
    <link rel="shortcut icon" href="./mri.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <!-- Three.js and Anime.js CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        voltAmber: { 50: '#fffbeb', 500: '#f59e0b', 600: '#d97706', 900: '#78350f' },
                        voltDark: { 900: '#090d16', 950: '#04060b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden bg-voltDark-950 text-white">

    <!-- Three.js Canvas Background Animation Container -->
    <div id="canvas-container" class="absolute inset-0 z-0 opacity-80 pointer-events-none"></div>


    <main class="volt-container py-20 flex items-center justify-center my-auto relative z-10">
        <div class="max-w-lg w-full glossy-card p-8 sm:p-12 rounded-3xl border border-voltAmber-500/30 shadow-2xl text-center space-y-6 backdrop-blur-2xl bg-slate-950/85">
            <div class="w-20 h-20 bg-voltAmber-500/10 border border-voltAmber-500/30 text-voltAmber-500 rounded-3xl flex items-center justify-center mx-auto text-3xl font-black shadow-inner animate-pulse">
                <i class="fa-solid fa-car-battery"></i>
            </div>
            
            <div class="space-y-2">
                <span class="text-xs font-mono text-voltAmber-500 font-bold uppercase tracking-widest">Error 404 • Energy Core Offline</span>
                <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-red-400">Battery Disconnected.</h1>
                <p class="text-xs sm:text-sm text-slate-400 font-semibold leading-relaxed">
                    The requested diagnostics node or route has suffered a total voltage drop. Our mobile rescue units can guide you back to full charge.
                </p>
            </div>

            <div class="pt-4 flex flex-wrap justify-center gap-4">
                <a href="index.html" class="px-8 py-4 bg-voltAmber-500 hover:bg-voltAmber-600 text-slate-950 font-black rounded-full text-xs uppercase tracking-widest shadow-lg transition-all cursor-pointer">
                    Return to Consumer Portal
                </a>
                <a href="contact.html" class="px-8 py-4 bg-white/10 hover:bg-white/20 border border-white/20 text-gray-600 font-black rounded-full text-xs uppercase tracking-widest transition-all cursor-pointer backdrop-blur-md">
                    Contact Dispatch Desk
                </a>
            </div>
        </div>
    </main>



    <!-- Master Layout Script & World-Class Three.js / Anime.js Choreography -->
    <script src="./js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // World-class UI choreography using Anime.js
            anime({
                targets: '.glossy-card > *',
                translateY: [40, 0],
                opacity: [0, 1],
                delay: anime.stagger(120),
                easing: 'cubicBezier(0.16, 1, 0.3, 1)',
                duration: 1200
            });

            // Three.js 3D Battery Energy Core & Dynamic Grid Scene
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x04060b, 0.035);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 9);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Studio Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.PointLight(0xf59e0b, 4, 40);
            mainLight.position.set(4, 6, 4);
            scene.add(mainLight);

            const secondaryLight = new THREE.PointLight(0x38bdf8, 2, 40);
            secondaryLight.position.set(-4, -4, -4);
            scene.add(secondaryLight);

            // Constructing 3D Battery Group
            const batteryGroup = new THREE.Group();

            // Main Battery Body Cylinder
            const bodyGeo = new THREE.CylinderGeometry(1.3, 1.3, 3.4, 32);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x090d16,
                metalness: 0.85,
                roughness: 0.15,
                wireframe: false
            });
            const batteryBody = new THREE.Mesh(bodyGeo, bodyMat);
            batteryGroup.add(batteryBody);

            // Glowing Energy Rings around the Battery Core
            const ringGeo = new THREE.TorusGeometry(1.08, 0.06, 16, 64);
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b,
                emissive: 0xf59e0b,
                emissiveIntensity: 0.8,
                roughness: 0.2
            });

            const energyRings = [];
            for (let i = 0; i < 6; i++) {
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.y = -1.25 + (i * 0.5);
                ring.rotation.x = Math.PI / 2;
                batteryGroup.add(ring);
                energyRings.push(ring);
            }

            // Top Positive Terminal Pin
            const termGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.45, 24);
            const termMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.95, roughness: 0.1 });
            const terminal = new THREE.Mesh(termGeo, termMat);
            terminal.position.y = 1.92;
            batteryGroup.add(terminal);

            scene.add(batteryGroup);

            // Floating Ambient Energy Particles
            const particlesCount = 200;
            const particlesGeo = new THREE.BufferGeometry();
            const particlesPos = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i += 3) {
                particlesPos[i] = (Math.random() - 0.5) * 18;
                particlesPos[i+1] = (Math.random() - 0.5) * 18;
                particlesPos[i+2] = (Math.random() - 0.5) * 18;
            }

            particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPos, 3));
            const particlesMat = new THREE.PointsMaterial({
                color: 0xf59e0b,
                size: 0.07,
                transparent: true,
                opacity: 0.7
            });
            const fieldParticles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(fieldParticles);

            // Interactive Mouse Parallax Effect
            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - window.innerWidth / 2) * 0.001;
                mouseY = (event.clientY - window.innerHeight / 2) * 0.001;
            });

            // Smooth Render & Animation Loop
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsedTime = clock.getElapsedTime();

                // Lerp mouse movement for buttery smooth camera reaction
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;

                camera.position.x = targetX * 3;
                camera.position.y = -targetY * 3;
                camera.lookAt(scene.position);

                // Dynamic battery rotation
                batteryGroup.rotation.y = elapsedTime * 0.35;
                batteryGroup.rotation.z = Math.sin(elapsedTime * 0.4) * 0.15;

                // Pulse energy rings rhythmically simulating voltage flow
                energyRings.forEach((ring, index) => {
                    const wave = Math.sin(elapsedTime * 4 + index * 0.6);
                    const scale = 1 + wave * 0.08;
                    ring.scale.set(scale, scale, 1);
                    ring.material.emissiveIntensity = 0.5 + wave * 0.5;
                });

                // Slowly rotate ambient particle field
                fieldParticles.rotation.y = elapsedTime * 0.04;
                fieldParticles.rotation.x = elapsedTime * 0.02;

                renderer.render(scene, camera);
            }
            animate();

            // Responsive Window Scaling
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
